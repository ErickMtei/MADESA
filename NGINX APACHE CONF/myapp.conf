# =====================================================================
# /etc/nginx/sites-available/myapp  (kisha: ln -s kwenda sites-enabled)
# RHEL/Rocky: weka kama /etc/nginx/conf.d/myapp.conf
# Nginx = Web Server (static) + Reverse Proxy (API/WebSocket)
# =====================================================================

# ---------------------------------------------------------------------
# 1. DEFAULT SERVER: kataa maombi ya domain/IP isiyojulikana
# ---------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;         # Nginx 1.19.4+
    return 444;
}

# ---------------------------------------------------------------------
# 2. HTTP -> HTTPS REDIRECT
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;        # BADILISHA

    # Inaruhusu Let's Encrypt (HTTP-01) kuthibitisha domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---------------------------------------------------------------------
# 3. www -> non-www (HTTPS)
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;                    # BADILISHA

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# ---------------------------------------------------------------------
# 4. SERVER KUU (HTTPS)
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;                        # BADILISHA

    root  /var/www/myapp/build;                     # BADILISHA: folda ya frontend
    index index.html;

    # ---------------- TLS ----------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---------------- SECURITY HEADERS ----------------
    # TAHADHARI: add_header ndani ya location HUFUTA headers za server level.
    # Kwa hiyo location zenye add_header zinahitaji kurudia, au tumia expires/proxy_hide_header.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # CSP inategemea app yako; jaribu kwanza kwa Content-Security-Policy-Report-Only:
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # ---------------- LIMITS ----------------
    limit_conn perip 30;                            # connections kwa IP moja

    # ---------------- KUZUIA FAILI NYETI ----------------
    # Dotfiles (.git, .env, .htaccess) zimezuiwa; .well-known inaruhusiwa
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(?:bak|config|sql|swp|log|ini|sh|inc|old|orig)$ {
        deny all;
    }

    # ---------------- WEB SERVER: FAILI ZA STATIC ----------------
    # Faili zenye hash kwenye jina (app.3f2a1.js) zinaweza kuwa immutable
    location /static/ {
        expires 30d;                                # (expires haifuti security headers)
        access_log off;
        gzip_static on;                             # tumia .gz iliyotengenezwa kabla
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------- REVERSE PROXY: API ----------------
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://myapp_backend;            # bila "/" mwishoni = path kamili inapelekwa
        proxy_http_version 1.1;
        proxy_set_header Connection "";             # inahitajika kwa upstream keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---------------- API YA UMMA ILIYO-CACHE-IWA ----------------
    location /api/public/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://myapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache appcache;
        proxy_cache_valid 200 301 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;                        # request moja tu inaenda backend
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        # Rudia security headers kwa sababu add_header iko hapa:
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------------- LOGIN: LIMIT KALI ----------------
    location /api/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://myapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- WEBSOCKET (futa kama huhitaji) ----------------
    location /ws/ {
        proxy_pass http://myapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------- FRONTEND (SPA) ----------------
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ /index.html;           # kwa tovuti ya kawaida: try_files $uri $uri/ =404;
    }

    # index.html isi-cache-iwe muda mrefu (ili updates zionekane)
    location = /index.html {
        expires -1;
    }

    # ---------------- MAKOSA (ERROR PAGES) ----------------
    error_page 429 @ratelimited;
    location @ratelimited {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"error":"too_many_requests"}';
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ---------------- MONITORING (localhost tu) ----------------
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # ---------------- LOGS ZA SITE HII ----------------
    access_log /var/log/nginx/myapp.access.log main_timed buffer=32k flush=5s;
    error_log  /var/log/nginx/myapp.error.log warn;
}
