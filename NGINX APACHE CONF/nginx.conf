# =====================================================================
# /etc/nginx/nginx.conf
# Mipangilio ya jumla: performance, logging, gzip, rate limit, cache
# Nginx 1.25.1+ inapendekezwa (kwa "http2 on;")
# =====================================================================

user www-data;                       # RHEL/Rocky: user nginx;
worker_processes auto;               # = idadi ya CPU cores
worker_rlimit_nofile 65535;          # file descriptors kwa worker
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;         # max connections kwa worker (ongeza watumiaji wakiongezeka)
    multi_accept off;
}

http {
    # ------------------------------------------------------------
    # 1. MSINGI
    # ------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    types_hash_max_size 2048;
    server_tokens off;               # ficha toleo la Nginx

    # ------------------------------------------------------------
    # 2. TIMEOUTS NA LIMITS ZA REQUEST (kinga dhidi ya slowloris)
    # ------------------------------------------------------------
    keepalive_timeout      65s;
    keepalive_requests     1000;
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;
    reset_timedout_connection on;

    client_max_body_size     20M;    # BADILISHA: ukubwa wa juu wa upload
    client_body_buffer_size  128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ------------------------------------------------------------
    # 3. LOGGING (ina $request_time kwa kupima kasi)
    # ------------------------------------------------------------
    log_format main_timed '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time urt=$upstream_response_time '
                          'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main_timed buffer=32k flush=5s;

    # ------------------------------------------------------------
    # 4. COMPRESSION (gzip)
    # ------------------------------------------------------------
    gzip              on;
    gzip_comp_level   5;             # 4-6 ni bora
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml
        font/ttf font/otf;
    # Picha (jpg/png/webp), mp4, zip, pdf, woff2 hazibanwi tena.

    # Brotli (washa kama umeinstall module ya brotli):
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # ------------------------------------------------------------
    # 5. RATE LIMITING (zones; zinatumika kwenye site config)
    # ------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # ------------------------------------------------------------
    # 6. PROXY CACHE (kwa endpoints za umma tu)
    # ------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=appcache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # ------------------------------------------------------------
    # 7. WEBSOCKET HELPER
    # ------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------
    # 8. UPSTREAM (backend servers / load balancing)
    # ------------------------------------------------------------
    upstream myapp_backend {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;   # BADILISHA port
        # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s; # ongeza instance zaidi
        keepalive 32;
    }

    # ------------------------------------------------------------
    # 9. REAL CLIENT IP (washa TU kama uko nyuma ya Cloudflare/LB)
    # ------------------------------------------------------------
    # set_real_ip_from 173.245.48.0/20;     # weka ranges rasmi za CDN yako
    # real_ip_header   CF-Connecting-IP;    # au X-Forwarded-For
    # real_ip_recursive on;

    # ------------------------------------------------------------
    # 10. INCLUDE SITES
    # ------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
