# ==========================================================
# deploy.conf
# Config ya deployment - badilisha values kulingana na server
# HII FAILI ISIWE KWENYE GIT (ongeza kwenye .gitignore)
# ==========================================================

# Path kuu ambapo services zote zitawekwa (clone + docker-compose.yml)
APPLICATION_INSTALLED_PATH="/opt/tpf/famis_django"

# Git server address (SSH host), mfano: git.yourcompany.com au 192.168.x.x
GIP_ADDRESS="192.168.57.29"

# Git organization/group jina kwenye server (bila jina la repo)
GIT_ORG="famis"

# Branch itakayo-deploy kwenye hii server
BRANCH="production"

# Idadi ya backup images za kubaki kwa kila service (za zamani zaidi zitafutwa)
BACKUP_KEEP_COUNT=3

# (Hiari) Docker registry endapo unatumia images kutoka registry badala ya kujenga local
# REGISTRY_ADDRESS="registry.yourcompany.com"

# ==========================================================
# Services zitakazo-deploy kwenye hii server
# Ongeza / ondoa / comment kulingana na server husika
# ==========================================================
SERVICES=(
    "famis_backend"
    "famis_frontend_portal"
  # "famis_frontend_staff"
)
